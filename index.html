<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Inventario</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilos.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <script src="app.js"></script>
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold"><i class="fa-solid fa-user-lock me-2 text-primary"></i>Iniciar Sesión</h2>
            <p class="text-muted">Ingresa tus credenciales para continuar</p>
        </div>
        <form id="formLogin">
            <div class="mb-3">
                <label for="correo" class="form-label">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" class="form-control" id="correo" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Ingresar</button>
        </form>
        <div class="text-center mt-3">
            <p class="mb-0">¿No tienes cuenta? <a href="registro.html" class="text-decoration-none">Regístrate aquí</a></p>
        </div>
    </div>

    <script>
        document.getElementById("formLogin").addEventListener("submit", async function(event) {
            event.preventDefault();
            const correo = document.getElementById("correo").value;
            const password = document.getElementById("password").value;

            try {
                const respuesta = await fetch("https://inventarioonline-production.up.railway.app/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ correo, password })
                });

                if (respuesta.ok) {
                    const data = await respuesta.json();
                    localStorage.setItem("usuario", JSON.stringify(data));
                    window.location.href = "principal.html";
                } else {
                    const errorData = await respuesta.json();
                    alert("Error: " + (errorData.error || "Credenciales incorrectas"));
                }
            } catch (error) {
                console.error("Error al iniciar sesión:", error);
                alert("Error de conexión con el servidor");
            }
        });
    </script>
</body>
</html>

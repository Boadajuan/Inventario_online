<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Inventario</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilos.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <script src="app.js"></script>
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold"><i class="fa-solid fa-user-plus me-2 text-primary"></i>Registro</h2>
            <p class="text-muted">Crea una nueva cuenta</p>
        </div>
        <form id="formRegistro">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre Completo</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control" id="nombre" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" class="form-control" id="correo" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Registrarse</button>
        </form>
        <div class="text-center mt-3">
            <p class="mb-0">¿Ya tienes cuenta? <a href="index.html" class="text-decoration-none">Inicia sesión</a></p>
        </div>
    </div>

    <script>
        document.getElementById("formRegistro").addEventListener("submit", async function(event) {
            event.preventDefault();
            const nombre = document.getElementById("nombre").value;
            const correo = document.getElementById("correo").value;
            const password = document.getElementById("password").value;

            try {
                const respuesta = await fetch("http://localhost:8080/api/auth/registro", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nombre, correo, password })
                });

                if (respuesta.ok) {
                    alert("Registro exitoso. Ahora puedes iniciar sesión.");
                    window.location.href = "index.html";
                } else {
                    const errorData = await respuesta.json();
                    alert("Error: " + (errorData.error || "No se pudo registrar"));
                }
            } catch (error) {
                console.error("Error al registrar:", error);
                alert("Error de conexión con el servidor");
            }
        });
    </script>
</body>
</html>
